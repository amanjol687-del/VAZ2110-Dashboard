name: Build VAZ 2110 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle | head -1)
          test -n "$PROJECT"
          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          import os
          p = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle")
          with open(p, "r") as f:
              s = f.read()

          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          )

          with open(p, "w") as f:
              f.write(s)
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAZ2110-Dashboard-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
