name: Build VAZ 2110 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
      - name: Fix JVM target
        run: |
          find source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print
          python3 - <<'PY'
          from pathlib import Path

          for p in Path("source").rglob("build.gradle"):
              s = p.read_text()
              if "kotlinOptions" in s:
                  s = s.replace("jvmTarget = '17'", "jvmTarget = '1.8'")
                  s = s.replace('jvmTarget = "17"', 'jvmTarget = "1.8"')
                  p.write_text(s)
                  print("Updated:", p)
          PY
                - name: Check JVM settings
        run: |
          echo "===== BUILD.GRADLE ====="
          cat source/VAZ2110_Full_Dashboard/app/build.gradle
          echo "===== ALL JVM TARGETS ====="
          grep -R "jvmTarget\|VERSION_1_8\|VERSION_17" source/VAZ2110_Full_Dashboard
      - name: Build APK
        run: |
          cd source/VAZ2110_Full_Dashboard
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAZ2110-Dashboard-APK
          path: source/VAZ2110_Full_Dashboard/app/build/outputs/apk/debug/app-debug.apk
